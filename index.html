      /* =========================================================
         CSV EXPORT
      ========================================================= */
      function csvCell(val) {
        const s = String(val === null || val === undefined ? "" : val);
        if (/[",\n\r]/.test(s)) {
          return `"${s.replace(/"/g, '""')}"`;
        }
        return s;
      }

      function exportReportCSV() {
        const stats = getDashboardStats();
        const { startDate, endDate } = uiState.reportPeriod;
        const periodTx = getFilteredTransactions({ startDate, endDate });

        const rows = [];
        rows.push(["LAPORAN INVENTARIS STOCKMATE"]);
        rows.push(["Nama Gudang", appData.settings.namaGudang]);
        rows.push(["Tanggal Ekspor", toISODate()]);
        rows.push(["Periode Transaksi", `${startDate || "Awal"} s/d ${endDate || "Sekarang"}`]);
        rows.push(["Total Jenis Produk", stats.totalJenis]);
        rows.push(["Total Kuantitas Stok", stats.totalStok]);
        rows.push(["Estimasi Nilai Inventaris (Rp)", stats.totalNilai]);
        rows.push([]);
        rows.push(["DAFTAR STOK PRODUK SAAT INI"]);
        rows.push(["SKU", "Nama Produk", "Kategori", "Stok", "Satuan/Paketan", "Minimum Stok", "Status", "Harga Beli", "Harga Jual", "Nilai Stok"]);
        appData.products.forEach(p => {
          const st = getStockStatus(p);
          rows.push([
            p.sku,
            p.nama,
            getCategoryName(p.kategoriId),
            p.stok,
            p.satuan,
            p.minimumStok,
            st.label,
            p.hargaBeli,
            p.hargaJual,
            (Number(p.stok) || 0) * (Number(p.hargaBeli) || 0)
          ]);
        });

        rows.push([]);
        rows.push(["RIWAYAT TRANSAKSI PERIODE TERPILIH"]);
        rows.push(["Nomor Transaksi", "Tanggal", "Tipe", "SKU", "Nama Produk", "Jumlah", "Harga Satuan", "Pemasok/Penerima", "Catatan"]);
        periodTx.forEach(t => {
          rows.push([
            t.nomorTransaksi,
            t.tanggal,
            t.tipe,
            t.skuSnapshot,
            t.namaProdukSnapshot,
            t.jumlah,
            t.hargaSatuan,
            t.pihakTerkait,
            t.catatan
          ]);
        });

        const csvString = "\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
        const blob = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `stockmate-laporan-${toISODate()}.csv`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        showToast("success", "File CSV laporan inventaris berhasil diunduh.");
      }

      /* =========================================================
         DELEGATED EVENTS & KEYBOARD ACCESSIBILITY
      ========================================================= */
      function triggerActionElement(el) {
        const action = el.getAttribute("data-action");
        const id = el.getAttribute("data-id");

        switch (action) {
          case "goto-products":
            navigateTo("produk");
            break;
          case "goto-transactions":
            navigateTo("transaksi");
            break;
          case "goto-reports":
            navigateTo("laporan");
            break;
          case "goto-settings":
            navigateTo("pengaturan");
            break;
          case "goto-low-stock":
            uiState.productFilters.status = "menipis";
            uiState.productFilters.categoryId = "all";
            uiState.productFilters.search = "";
            navigateTo("produk");
            break;
          case "open-product-modal":
            openProductFormModal(null);
            break;
          case "edit-product":
            openProductFormModal(id);
            break;
          case "view-product":
            openProductDetailModal(id);
            break;
          case "delete-product":
            confirmDeleteProduct(id);
            break;
          case "restock-product":
            openTransactionFormModal("IN", id);
            break;
          case "reset-product-filters":
            uiState.productFilters = { search: "", categoryId: "all", status: "all", sort: "name-asc" };
            document.getElementById("globalSearchInput").value = "";
            renderApp();
            break;
          case "open-mobile-product-filter":
            openMobileProductFilterModal();
            break;
          case "open-category-modal":
            openCategoryFormModal(null);
            break;
          case "edit-category":
            openCategoryFormModal(id);
            break;
          case "delete-category":
            handleDeleteCategory(id);
            break;
          case "open-tx-modal":
            openTransactionFormModal(el.getAttribute("data-tx-type") || "IN");
            break;
          case "view-tx":
            openTransactionDetailModal(id);
            break;
          case "reset-tx-filters":
            uiState.txFilters = { search: "", type: "all", startDate: "", endDate: "", sort: "newest" };
            renderApp();
            break;
          case "export-csv":
            exportReportCSV();
            break;
          case "confirm-reset-demo":
            confirmResetDemo();
            break;
          case "confirm-clear-all":
            confirmClearAllData();
            break;
          case "dismiss-demo-banner":
            uiState.demoBannerDismissed = true;
            renderApp();
            break;
          case "dismiss-recovery":
            storageRecoveryWarning = false;
            renderApp();
            break;
        }
      }

      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-action]");
        if (el) triggerActionElement(el);
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          const el = e.target.closest('[role="button"][data-action]');
          if (el) {
            e.preventDefault();
            triggerActionElement(el);
          }
        }
      });

      document.addEventListener("input", (e) => {
        const t = e.target;
        if (t.id === "productSearchInput") {
          uiState.productFilters.search = t.value;
          const pos = t.selectionStart;
          renderApp();
          const reInput = document.getElementById("productSearchInput");
          if (reInput) { reInput.focus(); reInput.setSelectionRange(pos, pos); }
        } else if (t.id === "txSearchInput") {
          uiState.txFilters.search = t.value;
          const pos = t.selectionStart;
          renderApp();
          const reInput = document.getElementById("txSearchInput");
          if (reInput) { reInput.focus(); reInput.setSelectionRange(pos, pos); }
        } else if (t.id === "globalSearchInput") {
          const pos = t.selectionStart;
          uiState.productFilters.search = t.value;
          if (uiState.currentPage !== "produk") {
            navigateTo("produk");
          } else {
            renderApp();
          }
          t.focus();
          try { t.setSelectionRange(pos, pos); } catch (err) {}
        }
      });

      document.addEventListener("change", (e) => {
        const t = e.target;
        if (t.id === "productCategoryFilter") {
          uiState.productFilters.categoryId = t.value;
          renderApp();
        } else if (t.id === "productStatusFilter") {
          uiState.productFilters.status = t.value;
          renderApp();
        } else if (t.id === "productSortSelect" || t.id === "mobileProductSortSelect") {
          uiState.productFilters.sort = t.value;
          renderApp();
        } else if (t.id === "txTypeFilter") {
          uiState.txFilters.type = t.value;
          renderApp();
        } else if (t.id === "txStartDate") {
          uiState.txFilters.startDate = t.value;
          renderApp();
        } else if (t.id === "txEndDate") {
          uiState.txFilters.endDate = t.value;
          renderApp();
        } else if (t.id === "txSortSelect") {
          uiState.txFilters.sort = t.value;
          renderApp();
        } else if (t.id === "reportPresetSelect") {
          const val = t.value;
          uiState.reportPeriod.preset = val;
          if (val === "7d") {
            uiState.reportPeriod.startDate = daysAgoISO(7);
            uiState.reportPeriod.endDate = toISODate();
          } else if (val === "30d") {
            uiState.reportPeriod.startDate = daysAgoISO(30);
            uiState.reportPeriod.endDate = toISODate();
          } else if (val === "month") {
            const now = new Date();
            uiState.reportPeriod.startDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-01`;
            uiState.reportPeriod.endDate = toISODate();
          } else if (val === "all") {
            uiState.reportPeriod.startDate = "";
            uiState.reportPeriod.endDate = "";
          }
          renderApp();
        } else if (t.id === "reportStartDate") {
          uiState.reportPeriod.preset = "custom";
          uiState.reportPeriod.startDate = t.value;
          renderApp();
        } else if (t.id === "reportEndDate") {
          uiState.reportPeriod.preset = "custom";
          uiState.reportPeriod.endDate = t.value;
          renderApp();
        }
      });

      document.addEventListener("submit", (e) => {
        if (e.target.id === "settingsForm") {
          e.preventDefault();
          const namaGudang = document.getElementById("setNamaGudang").value.trim();
          const alamatGudang = document.getElementById("setAlamatGudang").value.trim();
          const minimumStokDefault = Number(document.getElementById("setMinStok").value);
          const density = document.getElementById("setDensity").value;
          const rawWa = document.getElementById("setWaNumber").value.trim();
          const whatsappMessage = document.getElementById("setWaMessage").value.trim();

          document.getElementById("errSetNamaGudang").textContent = "";
          document.getElementById("errSetMinStok").textContent = "";
          document.getElementById("errSetWaNumber").textContent = "";

          let valid = true;
          if (!namaGudang) {
            document.getElementById("errSetNamaGudang").textContent = "Nama gudang tidak boleh kosong.";
            valid = false;
          }
          if (Number.isNaN(minimumStokDefault) || minimumStokDefault < 0) {
            document.getElementById("errSetMinStok").textContent = "Minimum stok default tidak boleh negatif.";
            valid = false;
          }
          if (rawWa && !sanitizeWhatsAppNumber(rawWa)) {
            document.getElementById("errSetWaNumber").textContent = "Format nomor tidak valid. Gunakan angka 9–15 digit (mis. 6281234567890).";
            valid = false;
          }

          if (!valid) {
            showToast("error", "Periksa kembali isian pengaturan yang masih keliru.");
            return;
          }

          appData.settings = {
            ...appData.settings,
            namaGudang,
            alamatGudang,
            minimumStokDefault,
            density,
            whatsappNumber: rawWa ? sanitizeWhatsAppNumber(rawWa) : "",
            whatsappMessage
          };

          if (saveState()) {
            showToast("success", "Pengaturan gudang berhasil disimpan.");
            renderApp();
          }
        }
      });

      document.getElementById("sidebarQuickAddBtn").addEventListener("click", () => {
        closeMobileSidebar();
        openProductFormModal(null);
      });
      document.getElementById("topbarTxBtn").addEventListener("click", () => {
        openTransactionFormModal("IN");
      });
      document.getElementById("demoModeBadge").addEventListener("click", openDemoInfoModal);

      function init() {
        appData = loadState();
        hydrateStaticIcons();
        renderApp();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
