      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .product-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .product-sku {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted-text);
      letter-spacing: 0.02em;
    }

    .product-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--deep-blue);
      margin: 4px 0 4px;
      line-height: 1.35;
    }

    .product-category {
      font-size: 0.82rem;
      color: var(--primary-blue);
      font-weight: 500;
    }

    .product-stats {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 10px;
      padding: 10px 12px;
      background-color: var(--warm-cream);
      border: 1px solid var(--warm-border);
      border-radius: 12px;
    }

    .stock-number {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--deep-blue);
      font-variant-numeric: tabular-nums;
    }

    .product-price {
      text-align: right;
    }

    .product-price small {
      display: block;
      font-size: 0.74rem;
      color: var(--muted-text);
    }

    .product-price strong {
      font-size: 0.92rem;
      color: var(--deep-blue);
      font-variant-numeric: tabular-nums;
    }

    .product-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .product-actions .btn-detail {
      flex: 1;
    }

    .category-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 640px) {
      .category-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .category-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .category-card {
      background-color: var(--cream-surface);
      border: 1px solid var(--warm-border);
      border-radius: var(--radius-card);
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--shadow-sm);
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    table.data-table th {
      padding: 12px 12px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted-text);
      border-bottom: 1px solid var(--warm-border);
      background-color: var(--warm-cream);
      white-space: nowrap;
    }

    table.data-table td {
      padding: 12px 12px;
      border-bottom: 1px solid var(--warm-border);
      vertical-align: middle;
    }

    table.data-table tr:last-child td {
      border-bottom: none;
    }

    .desktop-only-table {
      display: none;
    }

    .mobile-only-cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 768px) {
      .desktop-only-table {
        display: block;
      }
      .mobile-only-cards {
        display: none;
      }
    }

    .tx-mobile-card {
      background-color: var(--cream-surface);
      border: 1px solid var(--warm-border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .activity-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .activity-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      background-color: var(--warm-cream);
      border: 1px solid var(--warm-border);
      border-radius: 12px;
      cursor: pointer;
    }

    .activity-item:hover {
      background-color: var(--soft-blue);
    }

    .chart-container {
      position: relative;
      min-height: 260px;
      width: 100%;
    }

    .fallback-chart {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 6px;
    }

    .fallback-chart-note {
      font-size: 0.8rem;
      color: var(--muted-text);
      background-color: var(--soft-blue);
      padding: 8px 12px;
      border-radius: 8px;
    }

    .fallback-bar-row {
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 10px;
      align-items: center;
      font-size: 0.82rem;
    }

    .fallback-bars {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .fallback-bar-track {
      background-color: var(--warm-cream);
      border-radius: 6px;
      height: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .fallback-bar-fill {
      height: 100%;
      border-radius: 6px;
      min-width: 2px;
    }

    .empty-state {
      text-align: center;
      padding: 36px 20px;
      background-color: var(--cream-surface);
      border: 1px dashed #D7C8B3;
      border-radius: var(--radius-card);
      color: var(--muted-text);
    }

    .empty-state-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 12px;
      border-radius: 14px;
      background-color: var(--soft-blue);
      color: var(--primary-blue);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(18, 59, 86, 0.48);
      z-index: 60;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }

    .modal-backdrop.open {
      display: flex;
    }

    @media (min-width: 640px) {
      .modal-backdrop {
        align-items: center;
        padding: 20px;
      }
    }

    .modal-panel {
      background-color: var(--cream-surface);
      width: 100%;
      max-width: 640px;
      max-height: 92vh;
      border-radius: 18px 18px 0 0;
      border: 1px solid var(--warm-border);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 640px) {
      .modal-panel {
        border-radius: 18px;
      }
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--warm-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-body {
      padding: 18px 20px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--warm-border);
      background-color: var(--warm-cream);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 520px) {
      .detail-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .detail-item {
      background-color: var(--warm-cream);
      border: 1px solid var(--warm-border);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .detail-item small {
      display: block;
      font-size: 0.76rem;
      color: var(--muted-text);
      margin-bottom: 2px;
    }

    .detail-item strong {
      font-size: 0.95rem;
      color: var(--deep-blue);
      word-break: break-word;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    @media (min-width: 960px) {
      .settings-grid {
        grid-template-columns: 1.2fr 1fr;
      }
    }

    .danger-zone {
      border-color: #F2C0BB;
      background-color: #FFFDFC;
    }

    .toast-region {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 80;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: calc(100vw - 32px);
      width: 360px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      background-color: var(--cream-surface);
      border: 1px solid var(--warm-border);
      border-left: 4px solid var(--primary-blue);
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      padding: 12px 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.9rem;
    }

    .toast.success {
      border-left-color: var(--success);
    }

    .toast.error {
      border-left-color: var(--danger);
    }

    .toast.warning {
      border-left-color: var(--warning);
    }

    body.density-compact .card,
    body.density-compact .product-card,
    body.density-compact .category-card {
      padding: 13px;
    }

    .app-footer {
      padding: 16px;
      border-top: 1px solid var(--warm-border);
      background-color: var(--cream-surface);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.84rem;
      color: var(--muted-text);
    }

    @media (min-width: 1024px) {
      .app-footer {
        padding: 16px 28px;
      }
    }

    .save-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      background-color: var(--success-bg);
      color: var(--success);
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid #BEE4CF;
    }
  </style>
</head>

      function iconHtml(name, extraStyle = "") {
        if (typeof window.lucide !== "undefined" && typeof window.lucide.createIcons === "function") {
          return `<i data-lucide="${escapeHTML(name)}" aria-hidden="true" style="width:17px;height:17px;flex-shrink:0;${extraStyle}"></i>`;
        }
        const svg = FALLBACK_SVGS[name] || FALLBACK_SVGS["info"];
        return `<span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;${extraStyle}">${svg}</span>`;
      }

      function hydrateStaticIcons() {
        document.querySelectorAll("[data-icon]").forEach(el => {
          const name = el.getAttribute("data-icon");
          el.innerHTML = iconHtml(name);
        });
        const brandSlot = document.getElementById("brandIconSlot");
        if (brandSlot) {
          brandSlot.innerHTML = iconHtml("boxes", "width:20px;height:20px;");
        }
        if (typeof window.lucide !== "undefined" && typeof window.lucide.createIcons === "function") {
          try { window.lucide.createIcons(); } catch (e) {}
        }
      }

      /* =========================================================
         UTILITIES
      ========================================================= */
      function escapeHTML(str) {
        if (str === null || str === undefined) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatCurrency(num) {
        const val = Number(num) || 0;
        return "Rp " + val.toLocaleString("id-ID");
      }

      function formatNumber(num) {
        return (Number(num) || 0).toLocaleString("id-ID");
      }

      function toISODate(dateObj = new Date()) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, "0");
        const d = String(dateObj.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      function daysAgoISO(days) {
        const d = new Date();
        d.setDate(d.getDate() - days);
        return toISODate(d);
      }

      function formatDisplayDate(isoStr) {
        if (!isoStr) return "-";
        const parts = String(isoStr).split("T")[0].split("-");
        if (parts.length !== 3) return isoStr;
        const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
        const mIdx = parseInt(parts[1], 10) - 1;
        return `${parseInt(parts[2], 10)} ${months[mIdx] || parts[1]} ${parts[0]}`;
      }

      function formatTimeHHMM(isoStr) {
        if (!isoStr) return "";
        const d = new Date(isoStr);
        if (Number.isNaN(d.getTime())) return "";
        return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      }

      function uid(prefix) {
        return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
      }

      function uniqueStrings(list) {
        const seen = new Set();
        const result = [];
        list.forEach(item => {
          const clean = String(item || "").trim();
          if (!clean) return;
          const key = clean.toLowerCase();
          if (!seen.has(key)) {
            seen.add(key);
            result.push(clean);
          }
        });
        return result;
      }

      function getStockStatus(product) {
        const stok = Number(product.stok) || 0;
        const min = Number(product.minimumStok) || 0;
        if (stok <= 0) {
          return { key: "habis", label: "Habis", badgeClass: "badge-habis", icon: "x-circle" };
        }
        if (stok <= min) {
          return { key: "menipis", label: "Stok Menipis", badgeClass: "badge-menipis", icon: "alert-triangle" };
        }
        return { key: "aman", label: "Aman", badgeClass: "badge-aman", icon: "check-circle-2" };
      }

      function sanitizeWhatsAppNumber(raw) {
        if (!raw) return "";
        let digits = String(raw).replace(/[^\d]/g, "");
        if (digits.startsWith("0")) {
          digits = "62" + digits.slice(1);
        }
        if (digits.length < 9 || digits.length > 15) return "";
        return digits;
      }

      function buildWhatsAppUrl(number, message) {
        const clean = sanitizeWhatsAppNumber(number);
        if (!clean) return "";
        const text = encodeURIComponent(message || "Halo, saya ingin menghubungi pengelola gudang melalui StockMate.");
        return `https://wa.me/${clean}?text=${text}`;
      }

      function normalizeAppData(data) {
        const unitsFromProducts = (data.products || []).map(p => p.satuan);
        const existingUnits = Array.isArray(data.savedUnits) ? data.savedUnits : DEFAULT_UNITS;
        data.savedUnits = uniqueStrings([...DEFAULT_UNITS, ...existingUnits, ...unitsFromProducts]);

        const namesFromProducts = (data.products || []).map(p => p.nama);
        const existingNames = Array.isArray(data.savedProductNames) ? data.savedProductNames : [];
        data.savedProductNames = uniqueStrings([...existingNames, ...namesFromProducts]);

        const txSuppliers = (data.transactions || []).filter(t => t.tipe === "IN").map(t => t.pihakTerkait);
        const txReceivers = (data.transactions || []).filter(t => t.tipe === "OUT").map(t => t.pihakTerkait);
        data.savedSuppliers = uniqueStrings([...(data.savedSuppliers || []), ...txSuppliers]);
        data.savedReceivers = uniqueStrings([...(data.savedReceivers || []), ...txReceivers]);

        if (!data.lastSavedAt) {
          data.lastSavedAt = new Date().toISOString();
        }
        return data;
      }

      /* =========================================================

      ========================================================= */
      function showToast(type, message) {
        const region = document.getElementById("toastRegion");
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        const iconName = type === "success" ? "check-circle-2" : type === "error" ? "x-circle" : type === "warning" ? "alert-triangle" : "info";
        toast.innerHTML = `
          <div style="display:flex;align-items:flex-start;gap:8px;">
            <span style="margin-top:2px;color:${type === 'success' ? 'var(--success)' : type === 'error' ? 'var(--danger)' : type === 'warning' ? 'var(--warning)' : 'var(--primary-blue)'}">
              ${iconHtml(iconName)}
            </span>
            <span>${escapeHTML(message)}</span>
          </div>
          <button type="button" class="btn btn-outline btn-sm" style="min-height:28px;padding:2px 8px" aria-label="Tutup notifikasi">×</button>
        `;
        toast.querySelector("button").addEventListener("click", () => toast.remove());
        region.appendChild(toast);
        refreshDynamicIcons();
        setTimeout(() => {
          if (toast.parentNode) toast.remove();
        }, 4500);
      }

      /* =========================================================
         MODAL ENGINE
      ========================================================= */
      const modalBackdrop = document.getElementById("modalBackdrop");
      const modalTitleEl = document.getElementById("modalTitle");
      const modalBodyEl = document.getElementById("modalBody");
      const modalFooterEl = document.getElementById("modalFooter");
      let lastFocusedBeforeModal = null;

      function openModal({ title, bodyHtml, footerHtml = "", onMount = null }) {
        lastFocusedBeforeModal = document.activeElement;
        modalTitleEl.textContent = title;
        modalBodyEl.innerHTML = bodyHtml;
        modalFooterEl.innerHTML = footerHtml;
        modalFooterEl.style.display = footerHtml ? "flex" : "none";
        modalBackdrop.classList.add("open");
        refreshDynamicIcons();
        if (typeof onMount === "function") {
          onMount(modalBodyEl, modalFooterEl);
        }
        const firstInput = modalBodyEl.querySelector("input, select, textarea, button");
        if (firstInput) {
          setTimeout(() => firstInput.focus(), 40);
        }
      }

      function closeModal() {
        modalBackdrop.classList.remove("open");
        modalBodyEl.innerHTML = "";
        modalFooterEl.innerHTML = "";
        if (lastFocusedBeforeModal && typeof lastFocusedBeforeModal.focus === "function") {
          lastFocusedBeforeModal.focus();
        }
      }

      document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
      modalBackdrop.addEventListener("click", (e) => {
        if (e.target === modalBackdrop) closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (modalBackdrop.classList.contains("open")) closeModal();
          closeMobileSidebar();
        }
      });

      /* =========================================================
         SIDEBAR & NAVIGATION
      ========================================================= */
      const sidebar = document.getElementById("sidebar");
      const sidebarBackdrop = document.getElementById("sidebarBackdrop");
      const openSidebarBtn = document.getElementById("openSidebarBtn");
      const closeSidebarBtn = document.getElementById("closeSidebarBtn");

      function openMobileSidebar() {
        sidebar.classList.add("open");
        sidebarBackdrop.classList.add("open");
        openSidebarBtn.setAttribute("aria-expanded", "true");
        closeSidebarBtn.style.display = "inline-flex";
      }

      function closeMobileSidebar() {
        sidebar.classList.remove("open");
        sidebarBackdrop.classList.remove("open");
        openSidebarBtn.setAttribute("aria-expanded", "false");
        closeSidebarBtn.style.display = "none";
      }

      openSidebarBtn.addEventListener("click", openMobileSidebar);
      closeSidebarBtn.addEventListener("click", closeMobileSidebar);
      sidebarBackdrop.addEventListener("click", closeMobileSidebar);

      function navigateTo(page) {
        uiState.currentPage = page;
        document.querySelectorAll("#sidebarNav .nav-item").forEach(btn => {
          const isActive = btn.getAttribute("data-nav") === page;
          btn.classList.toggle("active", isActive);
          btn.setAttribute("aria-current", isActive ? "page" : "false");
        });
        closeMobileSidebar();
        renderApp();
        window.scrollTo({ top: 0, behavior: "auto" });
      }

      document.getElementById("sidebarNav").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-nav]");
        if (btn) navigateTo(btn.getAttribute("data-nav"));
      });

      /* =========================================================
         DATA COMPUTATIONS
      ========================================================= */
      function getCategoryName(categoryId) {
        const cat = appData.categories.find(c => c.id === categoryId);
        return cat ? cat.nama : "Tanpa Kategori";
      }

      function getDashboardStats() {
        const products = appData.products;
        const totalJenis = products.length;
        let totalStok = 0;
        let totalNilai = 0;
        let lowCount = 0;
        let outCount = 0;

        products.forEach(p => {
          const stok = Number(p.stok) || 0;
          const beli = Number(p.hargaBeli) || 0;
          const min = Number(p.minimumStok) || 0;
          totalStok += stok;
          totalNilai += stok * beli;
          if (stok <= 0) outCount++;
          else if (stok <= min) lowCount++;
        });

        return {
          totalJenis,
          totalStok,
          totalNilai,
          lowCount,
          outCount,
          needAttentionCount: lowCount + outCount
        };
      }

      function generateTxNumber(type) {
        const dateStr = toISODate().replace(/-/g, "");
        const count = appData.transactions.filter(t => t.tipe === type).length + 1;
        return `TRX-${type}-${dateStr}-${String(count).padStart(3, "0")}`;
      }

      function getFilteredProducts() {
        const { search, categoryId, status, sort } = uiState.productFilters;
        const q = search.trim().toLowerCase();

        let list = appData.products.filter(p => {
          if (q) {
            const matchName = p.nama.toLowerCase().includes(q);
            const matchSku = p.sku.toLowerCase().includes(q);
            const matchUnit = (p.satuan || "").toLowerCase().includes(q);
            if (!matchName && !matchSku && !matchUnit) return false;
          }
          if (categoryId !== "all" && p.kategoriId !== categoryId) return false;
          if (status !== "all") {
            const st = getStockStatus(p).key;
            if (st !== status) return false;
          }
          return true;
        });

        list.sort((a, b) => {
          switch (sort) {
            case "name-desc": return b.nama.localeCompare(a.nama, "id");
            case "stock-asc": return (Number(a.stok) || 0) - (Number(b.stok) || 0);
            case "stock-desc": return (Number(b.stok) || 0) - (Number(a.stok) || 0);
            case "price-asc": return (Number(a.hargaJual) || 0) - (Number(b.hargaJual) || 0);
            case "price-desc": return (Number(b.hargaJual) || 0) - (Number(a.hargaJual) || 0);
            case "name-asc":
            default:
              return a.nama.localeCompare(b.nama, "id");
          }
        });

        return list;
      }

      function getActiveProductFilterCount() {
        let count = 0;
        if (uiState.productFilters.categoryId !== "all") count++;
        if (uiState.productFilters.status !== "all") count++;
        return count;
      }

      function getFilteredTransactions(customRange = null) {
        const search = customRange ? "" : uiState.txFilters.search.trim().toLowerCase();
        const type = customRange ? "all" : uiState.txFilters.type;
        const startDate = customRange ? customRange.startDate : uiState.txFilters.startDate;
        const endDate = customRange ? customRange.endDate : uiState.txFilters.endDate;
        const sort = customRange ? "newest" : uiState.txFilters.sort;

        let list = appData.transactions.filter(t => {
          if (search) {
            const mNo = (t.nomorTransaksi || "").toLowerCase().includes(search);
            const mName = (t.namaProdukSnapshot || "").toLowerCase().includes(search);
            const mSku = (t.skuSnapshot || "").toLowerCase().includes(search);
            if (!mNo && !mName && !mSku) return false;
          }
          if (type !== "all" && t.tipe !== type) return false;
          if (startDate && t.tanggal < startDate) return false;
          if (endDate && t.tanggal > endDate) return false;
          return true;
        });

        list.sort((a, b) => {
          const timeA = `${a.tanggal}|${a.createdAt || ""}`;
          const timeB = `${b.tanggal}|${b.createdAt || ""}`;
          return sort === "oldest" ? timeA.localeCompare(timeB) : timeB.localeCompare(timeA);
        });

        return list;
      }

      function aggregateTransactionsByDate(transactions, maxDays = 7) {
        const map = {};
        transactions.forEach(t => {
          const d = t.tanggal;
          if (!map[d]) map[d] = { date: d, inQty: 0, outQty: 0 };
          if (t.tipe === "IN") map[d].inQty += Number(t.jumlah) || 0;
          else map[d].outQty += Number(t.jumlah) || 0;
        });
        const sorted = Object.values(map).sort((a, b) => a.date.localeCompare(b.date));
        return maxDays ? sorted.slice(-maxDays) : sorted;
      }

      /* =========================================================
         CHROME UPDATES
      ========================================================= */
      function renderChrome() {
        const stats = getDashboardStats();
        const badge = document.getElementById("navLowStockBadge");
        if (stats.needAttentionCount > 0) {
          badge.style.display = "inline-block";
          badge.textContent = stats.needAttentionCount;
        } else {
          badge.style.display = "none";
        }

        document.getElementById("sidebarWarehouseName").textContent = appData.settings.namaGudang || "Gudang Utama";
        document.getElementById("demoModeBadge").style.display = appData.isDemo ? "inline-flex" : "none";
        document.body.classList.toggle("density-compact", appData.settings.density === "compact");

        const waUrl = buildWhatsAppUrl(appData.settings.whatsappNumber, appData.settings.whatsappMessage);
        const waBtnHtml = waUrl
          ? `<a href="${escapeHTML(waUrl)}" target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp btn-sm" style="width:100%" title="Buka WhatsApp untuk meninjau pesan sebelum mengirim">${iconHtml("message-circle")}<span>Hubungi via WhatsApp</span></a>`
          : "";

        document.getElementById("sidebarWhatsappContainer").innerHTML = waBtnHtml;

        const footerArea = document.getElementById("footerActionArea");
        if (waUrl) {
          footerArea.innerHTML = `<a href="${escapeHTML(waUrl)}" target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp btn-sm">${iconHtml("message-circle")}<span>Hubungi via WhatsApp</span></a>`;
        } else {
          footerArea.innerHTML = `<span>Kontak WhatsApp opsional belum diatur (<button type="button" data-action="goto-settings" style="background:none;border:0;padding:0;color:var(--primary-blue);font-weight:600;cursor:pointer;text-decoration:underline">Atur di Pengaturan</button>)</span>`;
        }

        updateSaveStatusBadge();
      }

      /* =========================================================
         CHART RENDERER
      ========================================================= */
      function renderMovementChart(canvasId, fallbackId, series, emptyText = "Belum ada aktivitas stok pada rentang waktu ini.", showTxAction = false) {
        const canvas = document.getElementById(canvasId);
        const fallbackEl = document.getElementById(fallbackId);
        if (!canvas || !fallbackEl) return;

        if (!series || series.length === 0) {
          canvas.style.display = "none";
          fallbackEl.style.display = "block";
          fallbackEl.innerHTML = `
            <div class="empty-state" style="padding:26px 14px">
              <p style="margin-bottom:${showTxAction ? "12px" : "0"}">${escapeHTML(emptyText)}</p>
              ${showTxAction ? `<button type="button" class="btn btn-primary btn-sm" data-action="open-tx-modal" data-tx-type="IN">${iconHtml("plus")}<span>Catat Transaksi</span></button>` : ""}
            </div>`;
          return;
        }

        const labels = series.map(s => formatDisplayDate(s.date));
        const inData = series.map(s => s.inQty);
        const outData = series.map(s => s.outQty);

        if (typeof window.Chart !== "undefined") {
          canvas.style.display = "block";
          fallbackEl.style.display = "none";

          if (canvasId === "dashboardChart" && dashboardChartInstance) dashboardChartInstance.destroy();
          if (canvasId === "reportChart" && reportChartInstance) reportChartInstance.destroy();

          const instance = new window.Chart(canvas.getContext("2d"), {
            type: "bar",
            data: {
              labels,
              datasets: [
                { label: "Stok Masuk (IN)", data: inData, backgroundColor: "#176B9A", borderRadius: 6 },
                { label: "Stok Keluar (OUT)", data: outData, backgroundColor: "#D99B26", borderRadius: 6 }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: "bottom", labels: { color: "#123B56", usePointStyle: true, padding: 14 } }
              },
              scales: {
                x: { grid: { display: false }, ticks: { color: "#536574" } },
                y: { beginAtZero: true, ticks: { color: "#536574", precision: 0 }, grid: { color: "#EFE6D8" } }
              }
            }
          });

          if (canvasId === "dashboardChart") dashboardChartInstance = instance;
          if (canvasId === "reportChart") reportChartInstance = instance;
        } else {
          canvas.style.display = "none";
          fallbackEl.style.display = "block";
          const maxVal = Math.max(1, ...inData, ...outData);
          fallbackEl.innerHTML = `
            <div class="fallback-chart">
              <div class="fallback-chart-note">
                Grafik ditampilkan dalam mode ringkasan teks/batang (library grafik eksternal tidak termuat).
              </div>
              <div style="display:flex;gap:14px;font-size:0.82rem;font-weight:600">
                <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:#176B9A;display:inline-block"></span>Stok Masuk (IN)</span>
                <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:#D99B26;display:inline-block"></span>Stok Keluar (OUT)</span>
              </div>
              ${series.map(item => `
                <div class="fallback-bar-row">
                  <span style="color:var(--muted-text);font-weight:600">${escapeHTML(formatDisplayDate(item.date))}</span>
                  <div class="fallback-bars">
                    <div class="fallback-bar-track" title="Masuk: ${item.inQty}">
                      <div class="fallback-bar-fill" style="width:${Math.round((item.inQty / maxVal) * 100)}%;background:#176B9A"></div>
                      <span style="margin-left:6px;font-size:0.75rem;font-weight:600">IN: ${formatNumber(item.inQty)}</span>
                    </div>
                    <div class="fallback-bar-track" title="Keluar: ${item.outQty}">
                      <div class="fallback-bar-fill" style="width:${Math.round((item.outQty / maxVal) * 100)}%;background:#D99B26"></div>
                      <span style="margin-left:6px;font-size:0.75rem;font-weight:600">OUT: ${formatNumber(item.outQty)}</span>
                    </div>
                  </div>
                </div>
              `).join("")}
            </div>
          `;
        }
      }

      /* =========================================================
         PAGE RENDERERS
      ========================================================= */
      function renderApp() {
        renderChrome();
        const main = document.getElementById("mainContent");

        if (uiState.currentPage === "dashboard") {
          main.innerHTML = renderDashboardView();
          const series = aggregateTransactionsByDate(appData.transactions, 7);
          renderMovementChart("dashboardChart", "dashboardChartFallback", series, "Belum ada transaksi tercatat.", true);
        } else if (uiState.currentPage === "produk") {
          main.innerHTML = renderProductsView();
        } else if (uiState.currentPage === "kategori") {
          main.innerHTML = renderCategoriesView();
        } else if (uiState.currentPage === "transaksi") {
          main.innerHTML = renderTransactionsView();
        } else if (uiState.currentPage === "laporan") {
          main.innerHTML = renderReportsView();
          const periodTx = getFilteredTransactions({
            startDate: uiState.reportPeriod.startDate,
            endDate: uiState.reportPeriod.endDate
          });
          const series = aggregateTransactionsByDate(periodTx, 14);
          renderMovementChart("reportChart", "reportChartFallback", series, "Belum ada transaksi pada periode yang dipilih.", true);
        } else if (uiState.currentPage === "pengaturan") {
          main.innerHTML = renderSettingsView();
        }

        refreshDynamicIcons();
      }

      function renderTransactionsView() {
        const filtered = getFilteredTransactions();
        const { search, type, startDate, endDate, sort } = uiState.txFilters;

        return `
          <div class="page-header">
            <div>

            </div>
            <div class="page-actions">
              <button type="button" class="btn btn-primary" data-action="open-tx-modal" data-tx-type="IN">
                ${iconHtml("arrow-down-left")}<span>Stok Masuk</span>
              </button>
              <button type="button" class="btn btn-warning" data-action="open-tx-modal" data-tx-type="OUT">
                ${iconHtml("arrow-up-right")}<span>Stok Keluar</span>
              </button>

          </div>

              <input id="txStartDate" type="date" class="form-control" style="width:auto" value="${escapeHTML(startDate)}" aria-label="Tanggal mulai" />
              <input id="txEndDate" type="date" class="form-control" style="width:auto" value="${escapeHTML(endDate)}" aria-label="Tanggal akhir" />

              <select id="txSortSelect" class="form-control" style="width:auto;min-width:150px" aria-label="Urutkan transaksi">

                      <tr>
                        <th>Nomor Transaksi</th>
                        <th>Tanggal</th>
                        <th>Jenis</th>
                        <th>Produk</th>
                        <th>Jumlah</th>

                        <th>Aksi</th>

                      ${filtered.map(tx => `
                        <tr>
                          <td style="font-weight:600;white-space:nowrap">${escapeHTML(tx.nomorTransaksi)}</td>
                          <td style="white-space:nowrap">${escapeHTML(formatDisplayDate(tx.tanggal))}</td>
                          <td>
                            <span class="badge ${tx.tipe === "IN" ? "badge-in" : "badge-out"}">
                              ${iconHtml(tx.tipe === "IN" ? "arrow-down-left" : "arrow-up-right")}
                              <span>${tx.tipe === "IN" ? "Masuk" : "Keluar"}</span>
                            </span>
                          </td>
                          <td>
                            <strong>${escapeHTML(tx.namaProdukSnapshot)}</strong>

                          <td>
                            <button type="button" class="btn btn-outline btn-sm" data-action="view-tx" data-id="${escapeHTML(tx.id)}">
                              ${iconHtml("eye")}<span>Detail</span>
                            </button>
                          </td>

                        <div style="font-size:0.78rem;color:var(--muted-text)">${escapeHTML(tx.pihakTerkait || "-")}</div>

        `;

      function renderReportsView() {
        const stats = getDashboardStats();
        const { preset, startDate, endDate } = uiState.reportPeriod;
        const periodTx = getFilteredTransactions({ startDate, endDate });

        const totalIn = periodTx.filter(t => t.tipe === "IN").reduce((sum, t) => sum + (Number(t.jumlah) || 0), 0);
        const totalOut = periodTx.filter(t => t.tipe === "OUT").reduce((sum, t) => sum + (Number(t.jumlah) || 0), 0);

        const sortedByStockDesc = [...appData.products].sort((a, b) => (Number(b.stok) || 0) - (Number(a.stok) || 0)).slice(0, 5);
        const sortedByStockAsc = [...appData.products].sort((a, b) => (Number(a.stok) || 0) - (Number(b.stok) || 0)).slice(0, 5);

        return `
          <div class="page-header">
            <div>
              <h1>Laporan Inventaris</h1>
              <p class="page-subtitle">Ringkasan stok gudang, pergerakan periode, dan ekspor data CSV.</p>
            </div>
            <div class="page-actions">
              <button type="button" class="btn btn-primary" data-action="export-csv">
                ${iconHtml("download")}<span>Ekspor CSV</span>
              </button>
            </div>
          </div>

            <div class="filter-row">
              <div>
                <label for="reportPresetSelect" class="form-label" style="margin-bottom:4px">Periode Cepat</label>
                <select id="reportPresetSelect" class="form-control" style="min-width:170px">
                  <option value="7d" ${preset === "7d" ? "selected" : ""}>7 Hari Terakhir</option>
                  <option value="30d" ${preset === "30d" ? "selected" : ""}>30 Hari Terakhir</option>
                  <option value="month" ${preset === "month" ? "selected" : ""}>Bulan Ini</option>
                  <option value="all" ${preset === "all" ? "selected" : ""}>Semua Waktu</option>
                  <option value="custom" ${preset === "custom" ? "selected" : ""}>Kustom</option>
                </select>
              </div>
              <div>
                <label for="reportStartDate" class="form-label" style="margin-bottom:4px">Dari Tanggal</label>
                <input id="reportStartDate" type="date" class="form-control" value="${escapeHTML(startDate)}" />
              </div>
              <div>
                <label for="reportEndDate" class="form-label" style="margin-bottom:4px">Sampai Tanggal</label>
                <input id="reportEndDate" type="date" class="form-control" value="${escapeHTML(endDate)}" />
              </div>
            </div>
          </section>

          <section class="kpi-grid">
            <div class="kpi-card">
              <div>
                <div class="kpi-label">Total Jenis Produk</div>
                <div class="kpi-value">${formatNumber(stats.totalJenis)}</div>
                <div class="kpi-note">Total kuantitas: ${formatNumber(stats.totalStok)} unit</div>
              </div>
              <span class="kpi-icon">${iconHtml("package")}</span>
            </div>

            <div class="kpi-card">
              <div>
                <div class="kpi-label">Estimasi Nilai Inventaris</div>
                <div class="kpi-value" style="font-size:1.3rem">${escapeHTML(formatCurrency(stats.totalNilai))}</div>
                <div class="kpi-note">Nilai stok saat ini</div>
              </div>
              <span class="kpi-icon">${iconHtml("wallet")}</span>
            </div>

            <div class="kpi-card">
              <div>
                <div class="kpi-label">Stok Masuk (Periode)</div>
                <div class="kpi-value">${formatNumber(totalIn)}</div>
                <div class="kpi-note">${formatNumber(periodTx.filter(t => t.tipe === "IN").length)} transaksi masuk</div>
              </div>
              <span class="kpi-icon">${iconHtml("arrow-down-left")}</span>
            </div>

            <div class="kpi-card">
              <div>
                <div class="kpi-label">Stok Keluar (Periode)</div>
                <div class="kpi-value">${formatNumber(totalOut)}</div>
                <div class="kpi-note">${formatNumber(periodTx.filter(t => t.tipe === "OUT").length)} transaksi keluar</div>
              </div>
              <span class="kpi-icon warning">${iconHtml("arrow-up-right")}</span>
            </div>
          </section>

          <section class="card" style="margin-bottom:18px">
            <div class="card-header">
              <div>
                <h2 style="margin:0;font-size:1.1rem">Grafik Pergerakan Inventaris</h2>
                <p class="page-subtitle" style="font-size:0.82rem;margin-top:2px">Total unit masuk dan keluar sesuai filter periode</p>
              </div>
            </div>
            <div class="chart-container">
              <canvas id="reportChart" aria-label="Grafik laporan pergerakan inventaris"></canvas>
              <div id="reportChartFallback" style="display:none"></div>

      /* =========================================================
         MODALS: PRODUCT CRUD & DETAIL (WITH SAVED PAKETAN & AUTOFILL)
      ========================================================= */
      function openProductFormModal(productId = null) {
        const isEdit = Boolean(productId);
        const existing = isEdit ? appData.products.find(p => p.id === productId) : null;
        if (isEdit && !existing) return;

        if (appData.categories.length === 0) {
          showToast("warning", "Buat minimal satu kategori terlebih dahulu sebelum menambah produk.");
          navigateTo("kategori");
          openCategoryFormModal();
          return;
        }

        const p = existing || {
          sku: "",
          nama: "",
          kategoriId: appData.categories[0]?.id || "",
          deskripsi: "",
          satuan: "pcs",
          stok: 0,
          hargaBeli: 0,
          hargaJual: 0,
          minimumStok: appData.settings.minimumStokDefault || 10,
          createdAt: toISODate()
        };

        const unitsList = uniqueStrings([...appData.savedUnits, p.satuan]);
        const isCustomInitialUnit = p.satuan && !unitsList.some(u => u.toLowerCase() === p.satuan.toLowerCase());

        openModal({
          title: isEdit ? "Edit Produk" : "Tambah Produk / Paketan Baru",
          bodyHtml: `
            <form id="productModalForm" novalidate>
              ${(!isEdit && appData.products.length > 0)
                ? `<div class="preset-box">
                    <label class="form-label" for="prodPresetSelect" style="margin-bottom:4px">
                      ${iconHtml("copy", "width:14px;height:14px;vertical-align:text-bottom")} Salin dari Barang / Paketan Tersimpan (Opsional)
                    </label>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                      <select id="prodPresetSelect" class="form-control" style="flex:1;min-width:200px">
                        <option value="">-- Buat baru dari kosong, atau pilih barang tersimpan --</option>
                        ${appData.products.map(item => `
                          <option value="${escapeHTML(item.id)}">${escapeHTML(item.nama)} (${escapeHTML(item.satuan)}) — SKU: ${escapeHTML(item.sku)}</option>
                        `).join("")}
                      </select>
                      <button type="button" class="btn btn-secondary btn-sm" id="quickRestockFromPresetBtn" style="display:none">
                        ${iconHtml("arrow-down-left")}<span>Tambah Stok Barang Ini</span>
                      </button>
                    </div>
                    <span class="field-hint">Pilih untuk mengisi otomatis nama, paketan, dan harga, atau langsung tambah stoknya jika barang sudah sama persis.</span>
                  </div>`
                : ""
              }

              <div class="form-row form-row-2">
                <div class="form-group">
                  <label class="form-label" for="prodSku">Kode Produk (SKU) <span class="req">*</span></label>
                  <input id="prodSku" class="form-control" type="text" required placeholder="Contoh: ELK-003" value="${escapeHTML(p.sku)}" />
                  <span class="field-error" id="errProdSku"></span>
                </div>

                <div class="form-group">
                  <label class="form-label" for="prodCategory">Kategori <span class="req">*</span></label>
                  <select id="prodCategory" class="form-control" required>
                    ${appData.categories.map(c => `<option value="${escapeHTML(c.id)}" ${p.kategoriId === c.id ? "selected" : ""}>${escapeHTML(c.nama)}</option>`).join("")}
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="prodNama">Nama Produk / Paketan <span class="req">*</span></label>
                <input id="prodNama" class="form-control" type="text" list="savedProductNamesList" required placeholder="Ketik atau pilih nama produk/paketan tersimpan" value="${escapeHTML(p.nama)}" />
                <datalist id="savedProductNamesList">
                  ${appData.savedProductNames.map(name => `<option value="${escapeHTML(name)}"></option>`).join("")}
                </datalist>
                <span class="field-error" id="errProdNama"></span>
              </div>

              <div class="form-group">
                <label class="form-label" for="prodDesc">Deskripsi</label>
                <textarea id="prodDesc" class="form-control" placeholder="Deskripsi singkat spesifikasi atau isi paketan...">${escapeHTML(p.deskripsi || "")}</textarea>
              </div>

              <div class="form-row form-row-2">
                <div class="form-group">
                  <label class="form-label" for="prodSatuanSelect">Satuan / Nama Paketan <span class="req">*</span></label>
                  <select id="prodSatuanSelect" class="form-control">
                    ${unitsList.map(u => `<option value="${escapeHTML(u)}" ${!isCustomInitialUnit && u.toLowerCase() === (p.satuan || "").toLowerCase() ? "selected" : ""}>${escapeHTML(u)}</option>`).join("")}
                    <option value="__custom__" ${isCustomInitialUnit ? "selected" : ""}>+ Ketik nama paketan baru...</option>
                  </select>
                  <input id="prodSatuanCustom" class="form-control" type="text" placeholder="Mis. Paketan Hemat, Dus Besar, Karung..." style="margin-top:8px;display:${isCustomInitialUnit ? "block" : "none"}" value="${isCustomInitialUnit ? escapeHTML(p.satuan) : ""}" />
                  <span class="field-hint">Nama paketan baru yang disimpan otomatis muncul di daftar pilihan ini.</span>
                  <span class="field-error" id="errProdSatuan"></span>
                </div>

                <div class="form-group">
                  <label class="form-label" for="prodDate">Tanggal Penambahan <span class="req">*</span></label>
                  <input id="prodDate" class="form-control" type="date" required value="${escapeHTML((p.createdAt || toISODate()).split("T")[0])}" />
                </div>
              </div>

              <div class="form-row form-row-2">
                <div class="form-group">
                  <label class="form-label" for="prodStok">${isEdit ? "Jumlah Stok Saat Ini" : "Stok Awal"} <span class="req">*</span></label>
                  <input id="prodStok" class="form-control" type="number" min="0" step="1" required value="${escapeHTML(p.stok)}" />
                  <span class="field-error" id="errProdStok"></span>
                </div>

                <div class="form-group">
                  <label class="form-label" for="prodMinStok">Batas Minimum Stok <span class="req">*</span></label>
                  <input id="prodMinStok" class="form-control" type="number" min="0" step="1" required value="${escapeHTML(p.minimumStok)}" />
                  <span class="field-error" id="errProdMinStok"></span>
                </div>
              </div>

              <div class="form-row form-row-2">
                <div class="form-group">
                  <label class="form-label" for="prodHargaBeli">Harga Beli per Unit (Rp) <span class="req">*</span></label>
                  <input id="prodHargaBeli" class="form-control" type="number" min="0" step="100" required value="${escapeHTML(p.hargaBeli)}" />
                  <span class="field-error" id="errProdBeli"></span>
                </div>

                <div class="form-group">
                  <label class="form-label" for="prodHargaJual">Harga Jual per Unit (Rp) <span class="req">*</span></label>
                  <input id="prodHargaJual" class="form-control" type="number" min="0" step="100" required value="${escapeHTML(p.hargaJual)}" />
                  <span class="field-error" id="errProdJual"></span>
                </div>
              </div>
            </form>
          `,
          footerHtml: `
            <button type="button" class="btn btn-outline" id="cancelProdModal">Batal</button>
            <button type="submit" form="productModalForm" class="btn btn-primary">${iconHtml("check-circle-2")}<span>${isEdit ? "Simpan Perubahan" : "Simpan Produk"}</span></button>
          `,
          onMount: () => {
            const satuanSelect = document.getElementById("prodSatuanSelect");
            const satuanCustom = document.getElementById("prodSatuanCustom");

            satuanSelect.addEventListener("change", () => {
              if (satuanSelect.value === "__custom__") {
                satuanCustom.style.display = "block";
                satuanCustom.focus();
              } else {
                satuanCustom.style.display = "none";
                document.getElementById("errProdSatuan").textContent = "";
              }
            });

            const presetSelect = document.getElementById("prodPresetSelect");
            const quickRestockBtn = document.getElementById("quickRestockFromPresetBtn");
            if (presetSelect) {
              presetSelect.addEventListener("change", () => {
                const chosen = appData.products.find(item => item.id === presetSelect.value);
                if (!chosen) {
                  quickRestockBtn.style.display = "none";
                  return;
                }
                quickRestockBtn.style.display = "inline-flex";
                document.getElementById("prodNama").value = chosen.nama;
                document.getElementById("prodCategory").value = chosen.kategoriId;
                document.getElementById("prodDesc").value = chosen.deskripsi || "";
                document.getElementById("prodHargaBeli").value = chosen.hargaBeli;
                document.getElementById("prodHargaJual").value = chosen.hargaJual;
                document.getElementById("prodMinStok").value = chosen.minimumStok;

                const matchedOpt = Array.from(satuanSelect.options).find(opt => opt.value.toLowerCase() === (chosen.satuan || "").toLowerCase());
                if (matchedOpt) {
                  satuanSelect.value = matchedOpt.value;
                  satuanCustom.style.display = "none";
                } else {
                  satuanSelect.value = "__custom__";
                  satuanCustom.style.display = "block";
                  satuanCustom.value = chosen.satuan;
                }

                document.getElementById("prodSku").value = `${chosen.sku}-V2`;
                document.getElementById("prodSku").focus();
              });

              quickRestockBtn.addEventListener("click", () => {
                const chosenId = presetSelect.value;
                if (!chosenId) return;
                closeModal();
                openTransactionFormModal("IN", chosenId);
              });
            }

            document.getElementById("cancelProdModal").addEventListener("click", closeModal);
            document.getElementById("productModalForm").addEventListener("submit", (e) => {
              e.preventDefault();
              const sku = document.getElementById("prodSku").value.trim();
              const nama = document.getElementById("prodNama").value.trim();
              const kategoriId = document.getElementById("prodCategory").value;
              const deskripsi = document.getElementById("prodDesc").value.trim();
              const satuan = satuanSelect.value === "__custom__" ? satuanCustom.value.trim() : satuanSelect.value.trim();
              const createdAt = document.getElementById("prodDate").value || toISODate();
              const stok = Number(document.getElementById("prodStok").value);
              const minimumStok = Number(document.getElementById("prodMinStok").value);
              const hargaBeli = Number(document.getElementById("prodHargaBeli").value);
              const hargaJual = Number(document.getElementById("prodHargaJual").value);

              ["errProdSku", "errProdNama", "errProdSatuan", "errProdStok", "errProdMinStok", "errProdBeli", "errProdJual"].forEach(id => {
                document.getElementById(id).textContent = "";
              });

              let valid = true;
              if (!sku) {
                document.getElementById("errProdSku").textContent = "SKU wajib diisi.";
                valid = false;
              } else {
                const duplicate = appData.products.some(item => item.sku.toLowerCase() === sku.toLowerCase() && item.id !== productId);
                if (duplicate) {
                  document.getElementById("errProdSku").textContent = "SKU sudah digunakan produk lain. Gunakan SKU unik.";
                  valid = false;
                }
              }

              if (!nama) {
                document.getElementById("errProdNama").textContent = "Nama produk wajib diisi.";
                valid = false;
              }
              if (!satuan) {
                document.getElementById("errProdSatuan").textContent = "Satuan atau nama paketan wajib diisi.";
                valid = false;
              }
              if (Number.isNaN(stok) || stok < 0) {
                document.getElementById("errProdStok").textContent = "Stok tidak boleh negatif.";
                valid = false;
              }
              if (Number.isNaN(minimumStok) || minimumStok < 0) {
                document.getElementById("errProdMinStok").textContent = "Minimum stok tidak boleh negatif.";
                valid = false;
              }
              if (Number.isNaN(hargaBeli) || hargaBeli < 0) {
                document.getElementById("errProdBeli").textContent = "Harga beli tidak boleh negatif.";
                valid = false;
              }
              if (Number.isNaN(hargaJual) || hargaJual < 0) {
                document.getElementById("errProdJual").textContent = "Harga jual tidak boleh negatif.";
                valid = false;
              }

              if (!valid) return;

              const now = new Date().toISOString();
              if (isEdit) {
                const idx = appData.products.findIndex(item => item.id === productId);
                appData.products[idx] = {
                  ...appData.products[idx],
                  sku, nama, kategoriId, deskripsi, satuan,
                  stok, hargaBeli, hargaJual, minimumStok, createdAt, updatedAt: now
                };
              } else {
                appData.products.push({
                  id: uid("prd"),
                  sku, nama, kategoriId, deskripsi, satuan,
                  stok, hargaBeli, hargaJual, minimumStok, createdAt, updatedAt: now
                });
              }

              appData.savedUnits = uniqueStrings([...appData.savedUnits, satuan]);
              appData.savedProductNames = uniqueStrings([...appData.savedProductNames, nama]);

              if (saveState()) {
                closeModal();
                showToast("success", isEdit ? "Perubahan produk & paketan otomatis tersimpan." : `Produk "${nama}" (${satuan}) otomatis tersimpan.`);
                renderApp();
              }
            });
          }
        });
      }

      function openProductDetailModal(productId) {
        const p = appData.products.find(item => item.id === productId);
        if (!p) return;
        const st = getStockStatus(p);

        openModal({
          title: "Detail Produk",
          bodyHtml: `
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap">
              <div>
                <div style="font-size:0.82rem;color:var(--muted-text);font-weight:600">SKU: ${escapeHTML(p.sku)}</div>
                <h3 style="margin:4px 0 0;font-size:1.2rem">${escapeHTML(p.nama)}</h3>
              </div>
              <span class="badge ${st.badgeClass}">${iconHtml(st.icon)}<span>${st.label}</span></span>
            </div>

            <p style="font-size:0.9rem;color:var(--muted-text);margin-bottom:16px">
              ${escapeHTML(p.deskripsi || "Tidak ada deskripsi tambahan.")}
            </p>

            <div class="detail-grid">
              <div class="detail-item"><small>Kategori</small><strong>${escapeHTML(getCategoryName(p.kategoriId))}</strong></div>
              <div class="detail-item"><small>Satuan / Paketan</small><strong>${escapeHTML(p.satuan)}</strong></div>
              <div class="detail-item"><small>Stok Saat Ini</small><strong class="tabular">${formatNumber(p.stok)} ${escapeHTML(p.satuan)}</strong></div>
              <div class="detail-item"><small>Batas Minimum Stok</small><strong class="tabular">${formatNumber(p.minimumStok)} ${escapeHTML(p.satuan)}</strong></div>
              <div class="detail-item"><small>Harga Beli per Unit</small><strong class="tabular">${escapeHTML(formatCurrency(p.hargaBeli))}</strong></div>
              <div class="detail-item"><small>Harga Jual per Unit</small><strong class="tabular">${escapeHTML(formatCurrency(p.hargaJual))}</strong></div>
              <div class="detail-item"><small>Nilai Stok (Harga Beli)</small><strong class="tabular">${escapeHTML(formatCurrency((Number(p.stok) || 0) * (Number(p.hargaBeli) || 0)))}</strong></div>
              <div class="detail-item"><small>Tanggal Penambahan</small><strong>${escapeHTML(formatDisplayDate(p.createdAt))}</strong></div>
            </div>
          `,
          footerHtml: `
            <button type="button" class="btn btn-outline" id="detailEditBtn">${iconHtml("edit")}<span>Edit</span></button>
            <button type="button" class="btn btn-primary" id="detailInBtn">${iconHtml("arrow-down-left")}<span>Stok Masuk</span></button>
            <button type="button" class="btn btn-warning" id="detailOutBtn">${iconHtml("arrow-up-right")}<span>Stok Keluar</span></button>
          `,
          onMount: () => {

      /* =========================================================

      ========================================================= */
      function openCategoryFormModal(categoryId = null) {
        const isEdit = Boolean(categoryId);
        const existing = isEdit ? appData.categories.find(c => c.id === categoryId) : null;
        if (isEdit && !existing) return;

        const c = existing || { nama: "", deskripsi: "" };

        openModal({
          title: isEdit ? "Edit Kategori" : "Tambah Kategori Baru",
          bodyHtml: `
            <form id="categoryModalForm" novalidate>
              <div class="form-group">
                <label class="form-label" for="catNama">Nama Kategori <span class="req">*</span></label>
                <input id="catNama" class="form-control" type="text" required placeholder="Contoh: Elektronik" value="${escapeHTML(c.nama)}" />
                <span class="field-error" id="errCatNama"></span>
              </div>
              <div class="form-group">
                <label class="form-label" for="catDesc">Deskripsi</label>
                <textarea id="catDesc" class="form-control" placeholder="Keterangan singkat kelompok produk...">${escapeHTML(c.deskripsi || "")}</textarea>
              </div>
            </form>
          `,
          footerHtml: `
            <button type="button" class="btn btn-outline" id="cancelCatModal">Batal</button>
            <button type="submit" form="categoryModalForm" class="btn btn-primary">${iconHtml("check-circle-2")}<span>Simpan Kategori</span></button>
          `,
          onMount: () => {
            document.getElementById("cancelCatModal").addEventListener("click", closeModal);
            document.getElementById("categoryModalForm").addEventListener("submit", (e) => {
              e.preventDefault();
              const nama = document.getElementById("catNama").value.trim();
              const deskripsi = document.getElementById("catDesc").value.trim();
              document.getElementById("errCatNama").textContent = "";

              if (!nama) {
                document.getElementById("errCatNama").textContent = "Nama kategori wajib diisi.";
                return;
              }
              const duplicate = appData.categories.some(item => item.nama.toLowerCase() === nama.toLowerCase() && item.id !== categoryId);
              if (duplicate) {
                document.getElementById("errCatNama").textContent = "Nama kategori sudah ada.";
                return;
              }

              if (isEdit) {
                const idx = appData.categories.findIndex(item => item.id === categoryId);
                appData.categories[idx] = { ...appData.categories[idx], nama, deskripsi };
              } else {
                appData.categories.push({ id: uid("cat"), nama, deskripsi, createdAt: new Date().toISOString() });
              }

              if (saveState()) {
                closeModal();
                showToast("success", isEdit ? "Kategori berhasil diperbarui." : "Kategori baru berhasil ditambahkan.");
                renderApp();
              }
            });
          }
        });
      }

      function handleDeleteCategory(categoryId) {
        const cat = appData.categories.find(c => c.id === categoryId);
        if (!cat) return;
        const usedCount = appData.products.filter(p => p.kategoriId === categoryId).length;
        if (usedCount > 0) {
          showToast("error", `Kategori "${cat.nama}" tidak dapat dihapus karena masih digunakan oleh ${usedCount} produk.`);
          return;
        }

        openModal({
          title: "Konfirmasi Hapus Kategori",
          bodyHtml: `<p>Apakah Anda yakin ingin menghapus kategori <strong>${escapeHTML(cat.nama)}</strong>?</p>`,
          footerHtml: `
            <button type="button" class="btn btn-outline" id="cancelDelCat">Batal</button>
            <button type="button" class="btn btn-danger" id="confirmDelCat">${iconHtml("trash-2")}<span>Hapus Kategori</span></button>
          `,
          onMount: () => {
            document.getElementById("cancelDelCat").addEventListener("click", closeModal);
            document.getElementById("confirmDelCat").addEventListener("click", () => {
              appData.categories = appData.categories.filter(c => c.id !== categoryId);
              if (saveState()) {
                closeModal();
                showToast("success", `Kategori "${cat.nama}" dihapus.`);
                renderApp();
              }
            });
          }
        });
      }

      /* =========================================================
         MODALS: TRANSACTIONS (IN / OUT / DETAIL)
      ========================================================= */
      function openTransactionFormModal(type = "IN", preselectedProductId = null) {
        if (appData.products.length === 0) {
          showToast("warning", "Tambahkan minimal satu produk sebelum mencatat transaksi.");
          navigateTo("produk");
          openProductFormModal();
          return;
        }

        const isIn = type === "IN";
        const defaultProd = preselectedProductId
          ? appData.products.find(p => p.id === preselectedProductId)
          : appData.products[0];
        const txNum = generateTxNumber(type);
        const partySuggestions = isIn ? appData.savedSuppliers : appData.savedReceivers;

        openModal({
          title: isIn ? "Catat Stok Masuk" : "Catat Stok Keluar",
          bodyHtml: `
            <form id="txModalForm" novalidate>
              <div class="demo-banner" style="margin-bottom:14px;${isIn ? "" : "background-color:var(--warning-bg);border-color:#F0CB8D"}">
                <div class="demo-banner-text">
                  ${iconHtml(isIn ? "arrow-down-left" : "arrow-up-right")}
                  <span>${isIn ? "Penambahan stok barang ke gudang. Stok otomatis bertambah dan tersimpan." : "Pengurangan stok barang keluar dari gudang. Jumlah keluar tidak boleh melebihi stok tersedia."}</span>
                </div>
              </div>

              <div class="form-row form-row-2">
                <div class="form-group">
                  <label class="form-label" for="txNomor">Nomor Transaksi</label>
                  <input id="txNomor" class="form-control" type="text" readonly value="${escapeHTML(txNum)}" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="txTanggal">Tanggal Transaksi <span class="req">*</span></label>
                  <input id="txTanggal" class="form-control" type="date" required value="${escapeHTML(toISODate())}" />
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="txProduk">Produk <span class="req">*</span></label>
                <select id="txProduk" class="form-control" required>
                  ${appData.products.map(p => `
                    <option value="${escapeHTML(p.id)}" ${defaultProd && defaultProd.id === p.id ? "selected" : ""}>
                      ${escapeHTML(p.nama)} (${escapeHTML(p.sku)}) — Stok: ${formatNumber(p.stok)} ${escapeHTML(p.satuan)}
                    </option>
                  `).join("")}
                </select>
                <span class="field-hint" id="txStockHint"></span>
              </div>

              <div class="form-row form-row-2">
                <div class="form-group">
                  <label class="form-label" for="txJumlah">${isIn ? "Jumlah Masuk" : "Jumlah Keluar"} <span class="req">*</span></label>
                  <input id="txJumlah" class="form-control" type="number" min="1" step="1" required value="1" />
                  <span class="field-error" id="errTxJumlah"></span>
                </div>

                ${isIn
                  ? `<div class="form-group">
                      <label class="form-label" for="txHarga">Harga Beli per Unit (Rp) <span class="req">*</span></label>
                      <input id="txHarga" class="form-control" type="number" min="0" step="100" required value="${escapeHTML(defaultProd ? defaultProd.hargaBeli : 0)}" />
                      <span class="field-error" id="errTxHarga"></span>
                    </div>`
                  : `<div class="form-group">
                      <label class="form-label" for="txPihak">Tujuan / Penerima <span class="req">*</span></label>
                      <input id="txPihak" class="form-control" type="text" list="txPartyList" required placeholder="Contoh: Divisi Operasional / Cabang" />
                      <span class="field-error" id="errTxPihak"></span>
                    </div>`
                }
              </div>

              ${isIn
                ? `<div class="form-group">
                    <label class="form-label" for="txPihak">Sumber / Pemasok <span class="req">*</span></label>
                    <input id="txPihak" class="form-control" type="text" list="txPartyList" required placeholder="Contoh: PT Pemasok Nusantara" />
                    <span class="field-error" id="errTxPihak"></span>
                  </div>`
                : ""
              }

              <datalist id="txPartyList">
                ${partySuggestions.map(name => `<option value="${escapeHTML(name)}"></option>`).join("")}
              </datalist>

              <div class="form-group">
                <label class="form-label" for="txCatatan">Catatan Tambahan</label>
                <textarea id="txCatatan" class="form-control" placeholder="Nomor surat jalan, kondisi barang, atau keterangan lainnya..."></textarea>
              </div>
            </form>
          `,
          footerHtml: `
            <button type="button" class="btn btn-outline" id="cancelTxModal">Batal</button>
            <button type="submit" form="txModalForm" class="btn ${isIn ? "btn-primary" : "btn-warning"}">
              ${iconHtml("check-circle-2")}<span>${isIn ? "Simpan Stok Masuk" : "Simpan Stok Keluar"}</span>
            </button>
          `,
          onMount: () => {
            const prodSelect = document.getElementById("txProduk");
            const stockHint = document.getElementById("txStockHint");
            const hargaInput = document.getElementById("txHarga");

            function syncSelectedProductInfo() {
              const selected = appData.products.find(p => p.id === prodSelect.value);
              if (!selected) return;
              stockHint.textContent = `Stok saat ini: ${formatNumber(selected.stok)} ${selected.satuan} (Batas minimum: ${formatNumber(selected.minimumStok)} ${selected.satuan}).`;
              if (isIn && hargaInput) {
                hargaInput.value = selected.hargaBeli;
              }
            }

            syncSelectedProductInfo();
            prodSelect.addEventListener("change", syncSelectedProductInfo);
            document.getElementById("cancelTxModal").addEventListener("click", closeModal);

            document.getElementById("txModalForm").addEventListener("submit", (e) => {
              e.preventDefault();
              const produkId = prodSelect.value;
              const selectedIdx = appData.products.findIndex(p => p.id === produkId);
              const selected = appData.products[selectedIdx];
              const tanggal = document.getElementById("txTanggal").value || toISODate();
              const jumlah = Number(document.getElementById("txJumlah").value);
              const pihakTerkait = document.getElementById("txPihak").value.trim();
              const catatan = document.getElementById("txCatatan").value.trim();
              const hargaSatuan = isIn ? Number(document.getElementById("txHarga").value) : Number(selected.hargaBeli || 0);

              document.getElementById("errTxJumlah").textContent = "";
              document.getElementById("errTxPihak").textContent = "";
              if (document.getElementById("errTxHarga")) {
                document.getElementById("errTxHarga").textContent = "";
              }

              let valid = true;
              if (Number.isNaN(jumlah) || jumlah <= 0) {
                document.getElementById("errTxJumlah").textContent = "Jumlah harus lebih dari 0.";
                valid = false;
              } else if (!isIn && jumlah > Number(selected.stok)) {
                document.getElementById("errTxJumlah").textContent = `Jumlah melebihi stok tersedia! Stok saat ini hanya ${formatNumber(selected.stok)} ${selected.satuan}.`;
                valid = false;
              }

              if (isIn && (Number.isNaN(hargaSatuan) || hargaSatuan < 0)) {
                document.getElementById("errTxHarga").textContent = "Harga beli tidak boleh negatif.";
                valid = false;
              }

              if (!pihakTerkait) {
                document.getElementById("errTxPihak").textContent = isIn ? "Sumber atau pemasok wajib diisi." : "Tujuan atau penerima wajib diisi.";
                valid = false;
              }

              if (!valid) return;

              const now = new Date().toISOString();
              const nextStok = isIn ? Number(selected.stok) + jumlah : Number(selected.stok) - jumlah;
              if (nextStok < 0) return;

              appData.products[selectedIdx] = {
                ...selected,
                stok: nextStok,
                hargaBeli: isIn ? hargaSatuan : selected.hargaBeli,
                updatedAt: now
              };

              appData.transactions.push({
                id: uid("trx"),
                nomorTransaksi: txNum,
                tipe: type,
                tanggal,
                produkId: selected.id,
                namaProdukSnapshot: selected.nama,
                skuSnapshot: selected.sku,
                jumlah,
                hargaSatuan,
                pihakTerkait,
                catatan,
                createdAt: now
              });

              if (isIn) {
                appData.savedSuppliers = uniqueStrings([...appData.savedSuppliers, pihakTerkait]);
              } else {
                appData.savedReceivers = uniqueStrings([...appData.savedReceivers, pihakTerkait]);
              }

              if (saveState()) {
                closeModal();
                showToast("success", `Transaksi ${txNum} tersimpan otomatis. Stok "${selected.nama}" kini ${formatNumber(nextStok)} ${selected.satuan}.`);
                renderApp();
              }
            });
          }
        });
      }
